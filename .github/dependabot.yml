# 依存の更新 PR を Dependabot に作らせる設定。
# 選択肢の一覧: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # フロントエンドの npm 依存(package.json は frontend/ にある)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  # Go module は対象にしない。依存を宣言するファイルが go.tmpl.mod であり、
  # Wails のテンプレート変数({{.WailsVersion}})を含むため Dependabot が解釈できない。
